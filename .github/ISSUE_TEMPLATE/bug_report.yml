name: Bug report
description: Report reproducible behavior that appears incorrect.
title: "[Bug]: "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not include secrets, customer data
        or undisclosed security vulnerabilities.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is wrong, and what is the practical impact?
      placeholder: A concise description of the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Which release, tag or commit are you using?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the relevant system, runtime and registry or connector setup.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Provide the smallest reliable sequence that reproduces the problem.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant logs or additional context
      description: Remove secrets and personal data. Use code blocks for logs.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched for an existing issue covering this problem.
          required: true
        - label: This report does not contain an undisclosed security vulnerability.
          required: true
        - label: I have removed secrets, customer data and other sensitive information.
          required: true
